<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Evolution Logistics - AI-помощник</title>
  <script src="https://telegram.org"></script>
  <script src="https://cloudflare.com"></script>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Outfit:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0d192d; --navy2: #0f223d; --navy3: #1a304e;
      --blue: #1e7bfd; --blue2: #4a94ff; --blue-soft: #edf4fe;
      --bg: #f4f7fb; --card: #ffffff;
      --text: #1d2939; --text2: #667085; --text3: #98a2b3;
      --border: #e4e7ec; --border2: #d0d5dd;
      --ok: #12b76a; --ok-soft: #edfcf2; --warn: #f38f1a; --warn-soft: #fef6ee; --err: #f04438; --err-soft: #fef3f2;
      --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
      --shadow: 0 8px 30px rgba(13,25,41,0.06);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding-top: var(--sat); padding-bottom: var(--sab); overflow: hidden; }
    #app { display: flex; flex-direction: column; height: 100%; max-width: 520px; margin: 0 auto; position: relative; }
    .views { flex: 1; overflow-y: auto; position: relative; }
    .view { display: none; padding: 16px; }
    .view.on { display: block; }
    .chat-banner { background: var(--navy); color: #fff; padding: 12px; display: flex; align-items: center; gap: 10px; }
    .stat-box { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px; text-align: center; }
  </style>
</head>
<body>
  <div id="app">
    <div class="chat-banner">
      <div id="brandTap"><strong>Evolution Logistics</strong></div>
    </div>
    <div class="views">
      <div id="chat" class="view on">
        <div id="adminStats"></div>
        <textarea id="adminTariffs" style="width:100%; height:150px; display:none;"></textarea>
        <button id="micBtn" onclick="toggleVoice()">Mic</button>
        <input type="text" id="chatInput" placeholder="Введите сообщение...">
        <button onclick="sendChat()">Send</button>
        <input type="file" id="docFile" style="display:none;">
        <button onclick="document.getElementById('docFile').click()">Doc</button>
      </div>
    </div>
  </div>

  <script>
  let tg = window.Telegram ? window.Telegram.WebApp : null;
  let LANG = 'ru';
  let inTG = !!tg;
  let chatStarted = false;
  let lastQuote = null;
  let CONFIG = { email: 'info@evolution.com', whatsapp: '12345', phone: '12345', tgFallback: 'evo_support' };
  let TARIFFS = [];
  let TARIFFS_SEED = [];
  function haptic(t){}
  function autoGrow(e){}
  function callAI(b, t){}
  function addMsg(m, s){}
  function go(v){}
  function startChat(){}
  function t(k){ return k; }
  function store(k,v){ localStorage.setItem(k,v); }
  function load(k){ return localStorage.getItem(k); }
  function renderChips(){}
  function applyLang(){}

  function sendChat(){ 
    const inp=document.getElementById('chatInput'); 
    const text=inp.value.trim(); 
    if(!text)return; 
    haptic('light'); 
    inp.value=''; 
    autoGrow(inp); 
    callAI([{type:'text',text:text}], text); 
  }

  /* ---------- document recognition (vision) ---------- */
  document.getElementById('docFile').addEventListener('change',function(){
    const f=this.files&&this.files[0]; if(!f)return;
    const reader=new FileReader();
    reader.onload=()=>{
      const b64=String(reader.result).split(',')[1];
      addMsg('📎 '+f.name,'me');
      const prompt=(LANG==='ru'?'Это логистический документ (инвойс/упаковочный лист/AWB/CMR/контракт). Извлеки: отправитель/получатель, маршрут (страна+город), наименование груза, кол-во мест, вес, объём, габариты, стоимость. Верни кратко по пунктам и предложи сформировать заявку.':'This is a logistics document. Extract sender/consignee, route (country+city), cargo name, packages, weight, volume, dimensions, value. Return concise bullet points and offer to create a request.');
      let block;
      if(f.type==='application/pdf') block={type:'document',source:{type:'base64',media_type:'application/pdf',data:b64}};
      else block={type:'image',source:{type:'base64',media_type:f.type||'image/jpeg',data:b64}};
      if(!chatStarted){ go('chat'); startChat(); }
      showToast(t('doc_sent'));
      callAI([block,{type:'text',text:prompt}], null);
    };
    reader.readAsDataURL(f); this.value='';
  });

  /* ---------- voice input (Web Speech API) ---------- */
  let recog=null,recing=false;
  function toggleVoice(){
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){ alert(t('voice_na')); return; }
    if(recing){ try{recog.stop();}catch(e){} return; }
    recog=new SR(); recog.lang={ru:'ru-RU',en:'en-US',uz:'uz-UZ',zh:'zh-CN'}[LANG]||'ru-RU'; recog.interimResults=false; recog.maxAlternatives=1;
    recog.onstart=()=>{recing=true;document.getElementById('micBtn').classList.add('rec');haptic('light');};
    recog.onend=()=>{recing=false;document.getElementById('micBtn').classList.remove('rec');};
    recog.onerror=()=>{recing=false;document.getElementById('micBtn').classList.remove('rec');};
    recog.onresult=e=>{ const txt=e.results[0][0].transcript; const inp=document.getElementById('chatInput'); inp.value=(inp.value?inp.value+' ':'')+txt; autoGrow(inp); };
    try{recog.start();}catch(e){}
  }

  /* ---------- order / escalation ---------- */
  let orderCtx='order';
  function openOrder(ctx){
    orderCtx=ctx||'order'; haptic('medium');
    try{ const u=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user; if(u){ const n=[u.first_name,u.last_name].filter(Boolean).join(' '); if(n&&!document.getElementById('escName').value)document.getElementById('escName').value=n; } }catch(e){}
    let note='';
    if(lastQuote){ note=(LANG==='ru'?'Маршрут: ':'Route: ')+lastQuote.fromV+' → '+lastQuote.toV; if(lastQuote.kg)note+=', '+lastQuote.kg+' кг'; if(lastQuote.matched&&lastQuote.rate)note+=' · '+lastQuote.rate; }
    if(note&&!document.getElementById('escNote').value) document.getElementById('escNote').value=note;
    document.getElementById('orderH').textContent = (ctx==='order')?t('create_order'):t('esc_h');
    openSheet('sheetOrder');
  }
  function deptForMode(m){ return ({air:'air',rail:'rail',road:'road',sea:'rail',multi:'road'})[m]||'customs'; }
  function submitOrder(){
    haptic('medium'); bumpStat('lead');
    const num='EVL-'+new Date().toISOString().slice(0,10).replace(/-/g,'')+'-'+Math.floor(1000+Math.random()*9000);
    const u=(()=>{try{return (tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user)||{};}catch(e){return {};}})();
    const dept = (lastQuote&&lastQuote.mode)?deptForMode(lastQuote.mode):(['air','rail','road','customs','project'].includes(orderCtx)?orderCtx:'customs');
    const lead={ type:'lead', order:num, context:orderCtx, department:dept,
      name:document.getElementById('escName').value.trim(), phone:document.getElementById('escPhone').value.trim(), note:document.getElementById('escNote').value.trim(),
      tgId:u.id||null, tgUser:u.username||null, lang:LANG, quote:lastQuote||null, ts:new Date().toISOString() };
    try{ fetch('https://formsubmit.co,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({_subject:'🚚 Заявка из Mini App '+num,_template:'table',_captcha:'false','Номер':num,'Отдел':dept,'Имя':lead.name||'—','Контакт':lead.phone||'—','Детали':lead.note||'—','Telegram':lead.tgUser?('@'+lead.tgUser):(lead.tgId||'—'),'Язык':LANG,'Время':lead.ts})}).catch(function(){}); }catch(e){}
    if(inTG){ try{ tg.sendData(JSON.stringify(lead)); return; }catch(e){} }
    const txt=encodeURIComponent('Evolution Logistics — заявка '+num+'\nОтдел: '+dept+'\nИмя: '+lead.name+'\nКонтакт: '+lead.phone+'\nДетали: '+lead.note);
    window.open('https://wa.me');
    closeSheets(); showToast(t('order_created')+': '+num);
  }

  /* ---------- sheets ---------- */
  function openSheet(id){ haptic('light'); document.getElementById(id).classList.add('on'); if(id==='sheetContact')setupQuick(); }
  function closeSheets(){ document.querySelectorAll('.sheet-bg').forEach(s=>s.classList.remove('on')); }
  function setupQuick(){
    document.getElementById('qcTg').href = inTG?'#':'https://t.me;
    document.getElementById('qcTg').onclick=(e)=>{ if(inTG){e.preventDefault(); try{tg.openTelegramLink('https://t.me);}catch(err){} } };
    document.getElementById('qcWa').href='https://wa.me;
    document.getElementById('qcTel').href='tel:+'+CONFIG.phone;
    document.getElementById('qcMail').href='mailto:'+CONFIG.email;
  }

  /* ---------- toast ---------- */
  function showToast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('on'); setTimeout(()=>el.classList.remove('on'),2600); }

  /* ---------- admin (local demo) ---------- */
  let tapCount=0,tapTimer=null;
  document.getElementById('brandTap').addEventListener('click',()=>{ tapCount++; clearTimeout(tapTimer); tapTimer=setTimeout(()=>tapCount=0,1200); if(tapCount>=5){ tapCount=0; openAdmin(); } });
  function openAdmin(){ go('admin'); document.getElementById('adminTariffs').value=JSON.stringify(TARIFFS,null,1); renderAdminStats(); }
